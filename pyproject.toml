[project]
name = "ml-llm-ensembles"
version = "0.1.0"
description = "Reproducibility code for ML, language-model, router, and stacking experiments on phishing and network-intrusion data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.86.0",
    "boto3>=1.35.0",
    "datasets>=4.5.0",
    "google-genai>=1.0.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "ollama>=0.6.1",
    "openai>=2.0.0",
    "pandas>=3.0.0",
    "peft>=0.10.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "scapy>=2.7.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tabpfn>=8.0.7",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "transformers>=5.4.0",
    "xgboost>=3.2.0",
]
